# 前一層代理（Cloudflare / NPM）已終止 TLS，依 X-Forwarded-Proto 告知 PHP 是否為 HTTPS
# CI4 4.7+ 只在 REMOTE_ADDR 屬於 proxyIPs 時才信任 X-Forwarded-Proto，改用 $_SERVER['HTTPS'] 判斷較穩定
map $http_x_forwarded_proto $fastcgi_https {
    default "";
    https   on;
}

server {
    listen 80;
    server_name _;

    # Docker 內建 DNS，動態解析
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 上傳展示圖片用（PHP 端限制 10MB，這裡留一點餘裕給 multipart 表單）
    client_max_body_size 12m;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # CodeIgniter 4 document root（供 fastcgi 使用）
    root /var/www/html/public;

    # ─── Backend API（CodeIgniter 4，php-fpm FastCGI）─────────
    location /api {
        set $backend backend:9000;
        include        fastcgi_params;
        fastcgi_pass   $backend;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  /var/www/html/public/index.php;
        fastcgi_param  PATH_INFO        $fastcgi_path_info;
        fastcgi_param  PATH_TRANSLATED  /var/www/html/public/index.php;
        fastcgi_param  HTTPS            $fastcgi_https;

        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout    60s;
        fastcgi_read_timeout    60s;
        fastcgi_buffer_size     128k;
        fastcgi_buffers         4 256k;
    }

    # ─── 對外公開展示頁（/showcase、/showcase/image）──────────
    # 開關與 IP 白名單由 backend 檢查，因此不能當成前端靜態頁。
    location ~ ^/showcase(/|$) {
        set $backend backend:9000;
        include        fastcgi_params;
        fastcgi_pass   $backend;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  /var/www/html/public/index.php;
        fastcgi_param  PATH_INFO        $fastcgi_path_info;
        fastcgi_param  PATH_TRANSLATED  /var/www/html/public/index.php;
        fastcgi_param  HTTPS            $fastcgi_https;

        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout    60s;
        fastcgi_read_timeout    60s;
        fastcgi_buffer_size     128k;
        fastcgi_buffers         4 256k;
    }

    # ─── phpMyAdmin（/pma/ 前綴剝除後轉發）────────────────────
    location /pma/ {
        # set 必須在 rewrite ... break 之前求值，否則變數為空會 500
        set $upstream_pma http://phpmyadmin:80;
        # proxy_pass 用變數時不可帶 URI，故以 rewrite 剝除 /pma 前綴
        rewrite ^/pma/(.*)$ /$1 break;
        proxy_pass         $upstream_pma;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 無尾斜線時導正，避免相對路徑資源解析錯誤
    location = /pma {
        return 301 /pma/;
    }

    # ─── Frontend（Vue.js SPA）────────────────────────────────
    location / {
        set $upstream_frontend http://frontend;
        proxy_pass         $upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
    }
}
